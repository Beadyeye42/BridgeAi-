name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Schema validation only: CI must never receive production credentials.
      POSTGRES_PRISMA_URL: postgresql://audit:audit@127.0.0.1:5432/audit
      POSTGRES_URL_NON_POOLING: postgresql://audit:audit@127.0.0.1:5432/audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma validate
      - run: npm run build
      - run: npm audit --audit-level=low
